<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal LKPD Interaktif Informatika SMA</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap');
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b1120;
      color: #f8fafc;
    }

    .font-mono {
      font-family: 'Fira Code', monospace;
    }

    /* Glow effect background */
    .glow-bg {
      background: radial-gradient(circle at 50% -20%, rgba(239, 68, 68, 0.15), rgba(99, 102, 241, 0.08), transparent 70%);
    }
  </style>
</head>
<body class="min-h-screen glow-bg flex flex-col justify-between">

  <!-- ================= NAVBAR ================= -->
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-gradient-to-tr from-rose-500 to-indigo-600 rounded-xl shadow-lg shadow-rose-500/20">
          <i data-lucide="alert-triangle" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-extrabold text-white tracking-tight leading-none">INFORMATIKA SMA</h1>
          <p class="text-[11px] font-medium text-slate-400">Portal LKPD Digital Interaktif</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-rose-950/80 border border-rose-500/40 rounded-full text-xs font-semibold text-rose-300">
          <span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span>
          Akses Ditutup
        </span>
      </div>
    </div>
  </header>

  <!-- ================= MAIN SECTION (PENGUMUMAN) ================= -->
  <main class="max-w-4xl mx-auto px-4 sm:px-6 py-16 sm:py-24 flex-grow w-full flex items-center justify-center">
    
    <div class="w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 sm:p-12 shadow-2xl text-center relative overflow-hidden backdrop-blur-xl">
      <!-- Decorative Glow Accent -->
      <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-48 h-48 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Icon Warning/Lock -->
      <div class="inline-flex p-4 bg-rose-500/10 border border-rose-500/20 rounded-2xl text-rose-400 mb-6 shadow-inner">
        <i data-lucide="lock" class="w-10 h-10"></i>
      </div>

      <!-- Heading Pengumuman -->
      <h2 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight mb-6 leading-tight">
        PENGUMUMAN, LINK TUGAS LKPD DITUTUP
      </h2>

      <!-- Divider line -->
      <div class="w-24 h-1 bg-gradient-to-r from-rose-500 to-indigo-500 mx-auto rounded-full mb-8"></div>

      <!-- Subtitle / Kutipan -->
      <p class="text-base sm:text-lg font-mono font-bold text-rose-400/90 tracking-wide uppercase">
        ==== MENUNDA PEKERJAAN, MENABUNG DERITA ====
      </p>
    </div>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="border-t border-slate-800/80 bg-slate-950/80 py-6 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4">
      <p>© 2026 Informatika SMA • Design by Agus Suyatno, S.Kom</p>
    </div>
  </footer>

  <!-- SCRIPT ICON INITIALIZATION -->
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
